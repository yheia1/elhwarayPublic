<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم المشرف</title>
    <style>
        body {
            font-family: Arial;
            direction: rtl;
            padding: 20px;
            background: #f9f9f9;
        }
        h2, h3 {
            color: #333;
        }
        label, input, select {
            margin: 10px 0;
            display: block;
        }
        button {
            padding: 10px 15px;
            background: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .result {
            margin-top: 15px;
            color: green;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: #fff;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #eee;
        }
        .info-box {
            margin-top: 30px;
            padding: 15px;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h2>هل تريد طرد المستخدم؟</h2>

    <label for="username">اسم المستخدم:</label>
    <input type="text" id="username" placeholder="مثال: mod1">

    <label>سبب الطرد:</label>
    <label><input type="checkbox" value="ban"> كلام غير لائق</label>
    <label><input type="checkbox" value="ban"> سب</label>
    <label><input type="checkbox" value="ban"> سبام</label>
    <label><input type="checkbox" value="ban"> مخالفة القوانين</label>

    <button onclick="alert('تم تنفيذ الطرد')">تنفيذ الطرد</button>

    <h3>المستخدمين الحاليين:</h3>
    <table>
        <tr>
            <th>اسم المستخدم</th>
            <th>الدور</th>
        </tr>
        <tr>
            <td>ahmed</td>
            <td>مشرف</td>
        </tr>
        <tr>
            <td>user123</td>
            <td>مستخدم</td>
        </tr>
    </table>
</body>
</html>
